<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:ital,wght@0,400;1,400&family=Libre+Franklin:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(ellipse 900px 420px at 50% -10%,rgba(140,153,172,.16),transparent 65%),#152540;color:#F3F5F8;font-family:Inter,sans-serif;position:relative}
.frame{position:absolute;inset:26px 30px;background:url(FRAME) center/100% 100% no-repeat}
.in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 120px}
.kick{font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#EDF3FA;font-size:22px;border:1px solid rgba(140,153,172,.6);padding:8px 22px;margin-bottom:22px}
.latin{font-family:'Cormorant Garamond',serif;font-style:italic;letter-spacing:.22em;text-transform:uppercase;color:#BCCDE2;font-size:15px;margin-top:-12px;margin-bottom:20px}
.big{font-family:'Cormorant Garamond',serif;font-weight:700;text-transform:uppercase;font-size:84px;line-height:1;letter-spacing:.02em;
 background:linear-gradient(115deg,#8A97AA 0%,#DCE2EA 30%,#FFFFFF 46%,#DCE2EA 60%,#8A97AA 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.q{color:#BCCDE2;font-weight:600}
.h{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:52px;line-height:1.15;color:#F3F5F8;max-width:960px}
.sub{font-family:'Libre Franklin',sans-serif;font-size:21px;letter-spacing:.14em;text-transform:uppercase;color:#BCCDE2;margin-top:26px}
.stats{display:flex;gap:34px;margin-top:30px}
.stat{display:flex;flex-direction:column;align-items:center}
.stat b{font-family:Manrope,sans-serif;font-weight:800;font-size:44px;color:#fff;line-height:1}
.stat b.blue{color:#DCE7F5}
.stat span{font-family:'Libre Franklin',sans-serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#A9B8CC;margin-top:8px}
.stamp{display:inline-block;border:2px solid #DCE7F5;color:#DCE7F5;font-family:'Libre Franklin',sans-serif;font-weight:700;letter-spacing:5px;font-size:16px;text-transform:uppercase;padding:8px 18px;transform:rotate(-3deg);margin-bottom:22px}
.brand{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center;align-items:center;gap:14px;font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:#EDF3FA;letter-spacing:.06em}
.brand img{height:30px}
.btn{display:inline-block;margin-top:28px;font-family:'Libre Franklin',sans-serif;font-weight:700;font-size:18px;letter-spacing:2px;text-transform:uppercase;color:#0A1220;border:1px solid #DCE7F5;padding:14px 30px;text-shadow:0 1px 0 rgba(255,255,255,.45);
 background:linear-gradient(112deg,#74879F 0%,#97ACC6 20%,#C6D7EA 34%,#F2F7FC 46%,#FFFFFF 50%,#F2F7FC 54%,#C6D7EA 66%,#97ACC6 80%,#74879F 100%)}
</style></head><body><div class="frame"></div><div class="in">CONTENT</div>
<div class="brand"><img src="MARK" alt="">JenniferslawAction.org</div></body></html>
